<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Toolkit platform icon (iOS, Android, PWA, Windows installer): solid square, the system rounds the corners. Glyph stays inside the maskable safe zone. -->
  <defs>
    <linearGradient id="tkAppGradient" gradientUnits="userSpaceOnUse" x1="40" y1="40" x2="160" y2="160">
      <stop offset="0" stop-color="#8ED3F2"/>
      <stop offset="1" stop-color="#4B87BB"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="#0B1116"/>
  <path d="M55.9 51.7H144.1L100 100M100 51.7V148.3M100 100L144.1 148.3" fill="none" stroke="url(#tkAppGradient)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
